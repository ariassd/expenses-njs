      tags: *ref_0
  /v1/expenses/{id}/status:
    put:
      operationId: ExpensesController_updateStatus
      parameters:
        - name: id
          required: true
          in: path
          description: Expense UUID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensesUpdateStatusDTO'
