info:
  title: Expenses API
  description: Expenses management microservice
  version: '1.0'
  contact: {}
tags:
  - name: expenses
    description: ''
servers: []
components:
  schemas:
    ExpensesCreateDTO:
      type: object
      properties:
        clientId:
          type: string
          description: Client identifier (UUID, MongoID, or other string identifier)
        amount:
          type: number
          description: Expense amount
          example: 100.5
        currency:
          type: string
          description: ISO 4217 currency code
          example: USD
        category:
          type: string
          description: Expense category
          example: Food
        description:
          type: string
          description: Expense description
          example: Lunch at restaurant
        status:
          type: string
          description: Expense status
          enum:
            - pending
            - reviewed
            - voided
          default: pending
      required:
        - clientId
        - amount
        - currency
        - category
        - description
        - status
    Expenses:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier (UUID)
        amount:
          type: number
          description: Expense amount
          example: 100.5
        currency:
          type: string
          description: ISO 4217 currency code
          example: USD
        category:
          type: string
          description: Expense category
          example: Food
        description:
          type: string
          description: Expense description
          example: Lunch at restaurant
        clientId:
          type: string
          description: Client identifier
          example: uuid-or-mongoid
        status:
          type: string
          description: Expense status
          enum:
            - pending
            - reviewed
            - voided
        creationDate:
          format: date-time
          type: string
          description: Creation timestamp
        year:
          type: number
          description: Year of expense
          example: 2026
        month:
          type: number
          description: Month of expense (1-12)
          example: 6
        day:
          type: number
          description: Day of month
          example: 3
      required:
        - id
        - amount
        - currency
        - category
        - description
        - clientId
        - status
        - creationDate
        - year
        - month
        - day
    PaginationDTO:
      type: object
      properties:
        page:
          type: number
          description: Page number
          example: 1
          default: 1
        limit:
          type: number
          description: Items per page
          example: 25
          default: 25
        sort:
          type: string
          description: Sort order
          enum:
            - asc
            - desc
          default: asc
        countTotal:
          type: boolean
          description: Whether to count total items
          default: true
      required:
        - page
        - limit
        - sort
        - countTotal
    PaginationResult:
      type: object
      properties:
        data:
          description: List of items
          type: array
          items:
            type: array
        page:
          type: number
          description: Current page number
        limit:
          type: number
          description: Items per page
        sort:
          type: string
          description: Sort order
          enum:
            - asc
            - desc
        totalItems:
          type: number
          description: Total number of items
      required:
        - data
        - page
        - limit
        - sort
        - totalItems
    ExpensesAggregation:
      type: object
      properties:
        clientId:
          type: string
          description: Client identifier
        category:
          type: string
          description: Expense category
        year:
          type: number
          description: Year of expense
        month:
          type: number
          description: Month of expense (1-12)
        day:
          type: number
          description: Day of month
        currency:
          type: string
          description: ISO 4217 currency code
        count:
          type: number
          description: Number of expenses in this group
        totalAmount:
          type: number
          description: Total amount of expenses in this group
        creationDate:
          format: date-time
          type: string
          description: Creation timestamp
        updatedAt:
          format: date-time
          type: string
          description: Last update timestamp
      required:
        - clientId
        - category
        - year
        - month
        - day
        - currency
        - count
        - totalAmount
        - creationDate
        - updatedAt
    ExpensesUpdateStatusDTO:
      type: object
      properties:
        status:
          type: string
          description: Expense status
          enum:
            - pending
            - reviewed
            - voided
          default: pending
      required:
        - status
