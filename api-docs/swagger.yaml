      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensesCreateDTO'
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expenses'
        '409':
          description: Conflict - already exists
      summary: Create a new expense
      tags: &ref_0
        - expenses
    get:
      operationId: ExpensesController_list
      parameters:
        - name: queryFilter
          required: false
